name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Update npm
        run: npm install -g npm@latest

      - name: Show npm version
        run: npm --version

      - name: Check release matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'JS'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const expectedTag = `v${pkg.version}`;

          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match ${expectedTag}`);
          }

          if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('package-lock.json must match the package.json version');
          }
          JS

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Install Redis test tools
        run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools

      - name: Test Redis integration
        run: npm run test:redis

      - name: Publish package
        id: publish
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --ignore-scripts --access public --provenance --tag "$NPM_DIST_TAG"

      - name: Release summary
        if: ${{ always() }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const published = process.env.PUBLISH_OUTCOME === 'success';
          const packageName = '@nodana/phoenixd-mpp-sdk';
          const version = tag.replace(/^v/, '');
          const packageUrl = `https://www.npmjs.com/package/${packageName}/v/${version}`;
          const result = published
            ? `Published [${packageName}@${version}](${packageUrl}) to npm with provenance.`
            : 'Not published to npm. See the failed step in this run for details.';

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Release ${tag}\n\n${result}\n\n[GitHub release](${process.env.RELEASE_URL})\n`);
          JS
